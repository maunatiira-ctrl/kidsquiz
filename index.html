<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Quiz</title>
<meta name="description" content="A quiz game for kids aged 6 to 11, following the Australian and New Zealand curriculum.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: exercise-book page. A ruled paper ground, one wide column; the kid's game is big-button and centred on the card, the parent side is a scannable grid. */
:root {
  --paper: #f6f8fc;
  --rule: #dfe6f3;
  --card: #ffffff;
  --ink: #1d2a44;
  --muted: #5d6a85;
  --line: #d3dbea;
  --accent: #2f5bd3;      /* school-ink blue */
  --accent-soft: #e4ebfc;
  --crayon: #f2b630;      /* gold for earned credits */
  --crayon-ink: #6b4a00;
  --good: #1e8a54; --good-soft: #def3e7;
  --bad: #c43d3d; --bad-soft: #fbe3e3;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121826; --rule: #1b2336; --card: #1a2235; --ink: #e8edf8; --muted: #9aa6c0; --line: #2c3650;
  --accent: #7f9ef5; --accent-soft: #24304f; --crayon: #f5c451; --crayon-ink: #f5c451;
  --good: #5dd398; --good-soft: #17352a; --bad: #f08a8a; --bad-soft: #3a1f24; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121826; --rule: #1b2336; --card: #1a2235; --ink: #e8edf8; --muted: #9aa6c0; --line: #2c3650;
  --accent: #7f9ef5; --accent-soft: #24304f; --crayon: #f5c451; --crayon-ink: #f5c451;
  --good: #5dd398; --good-soft: #17352a; --bad: #f08a8a; --bad-soft: #3a1f24; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.5; color: var(--ink);
  background: var(--paper) repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
}
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; }
.brand h1 { white-space: nowrap; }
.brand h1 { font-size: 2rem; font-weight: 800; color: var(--accent); }
.brand span { color: var(--muted); font-size: .9rem; }
.tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
.sample { font-size: .85rem; color: var(--muted); margin: 0 0 18px; }
.sample b { color: var(--ink); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- kid side ---------- */
.kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.kidcard { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 18px; display: grid; gap: 6px; }
.kidcard:hover { border-color: var(--accent); }
.kidcard .face { font-size: 2.4rem; line-height: 1; }
.kidcard .name { font-family: var(--display); font-size: 1.5rem; font-weight: 700; }
.wallet { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.play { background: var(--accent-soft); color: var(--accent); }
.chip.earn { background: color-mix(in srgb, var(--crayon) 22%, transparent); color: var(--crayon-ink); }
.chip.grade { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }

.finger { display: grid; justify-items: center; gap: 12px; padding: 24px 0; text-align: center; }
.pad { width: 120px; height: 120px; border-radius: 50%; border: 3px dashed var(--accent); background: var(--accent-soft); font-size: 3.4rem; display: grid; place-items: center; }
.pad.scan { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .pad.scan { animation: none; } }

.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.subj { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px 12px; display: grid; justify-items: center; gap: 4px; font-weight: 700; }
.subj:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.subj:disabled { opacity: .45; cursor: not-allowed; }
.subj .ico { font-size: 2rem; }
.costline { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--paper); border: 1px dashed var(--line); font-size: .92rem; }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots i.ok { background: var(--good); } .dots i.no { background: var(--bad); } .dots i.now { background: var(--accent); }
.question { font-family: var(--display); font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; margin: 22px 0; text-wrap: balance; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.ans { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px; font-size: 1.15rem; font-weight: 700; text-align: left; min-height: 64px; }
.ans:hover:not(:disabled) { border-color: var(--accent); }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.ans:disabled { cursor: default; }
.feedback { min-height: 2em; margin-top: 14px; font-weight: 700; font-size: 1.1rem; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }

.result { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.result .big { font-family: var(--display); font-size: 3.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
.coins { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; font-size: 2rem; }

.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent-soft); }
.btn.gold { background: var(--crayon); color: #3d2a00; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- parent side ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel h2 { font-size: 1.3rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--paper); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(0, 1.3fr) 1fr 44px; gap: 8px; align-items: center; font-size: .88rem; }
.bar .track { display: block; height: 10px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar .fill.lo { background: var(--bad); } .bar .fill.mid { background: var(--crayon); } .bar .fill.hi { background: var(--good); }
.packs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.pack { border: 2px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px; display: grid; gap: 2px; text-align: left; }
.pack:hover { border-color: var(--accent); }
.pack b { font-family: var(--display); font-size: 1.4rem; }
.pack[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
label.f { display: grid; gap: 4px; font-size: .88rem; font-weight: 700; }
select, input[type=number] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
.cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; }
.tablewrap { overflow-x: auto; }
.lesson-title { font-size: 1.9rem; margin: 18px 0 12px; color: var(--accent); }
.lesson { display: grid; gap: 10px; max-width: 62ch; }
.lesson h3 { font-size: 1.45rem; }
.lesson p { margin: 0; font-size: 1.15rem; }
.example { border: 2px dashed var(--crayon); border-radius: 14px; padding: 12px 16px; background: color-mix(in srgb, var(--crayon) 10%, var(--card)); display: grid; gap: 4px; }
.example p { font-family: var(--display); font-size: 1.3rem; font-weight: 700; }
.toast { padding: 10px 14px; border-radius: 10px; background: var(--good-soft); color: var(--good); font-weight: 700; }
.confirm { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; background: var(--accent-soft); display: grid; gap: 8px; }
@media (max-width: 480px) { .sheet { padding: 18px; } .bar { grid-template-columns: minmax(0, 1.4fr) 1fr 40px; } .stats { grid-template-columns: repeat(3, minmax(0,1fr)); } }
input[type=text], input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
.pin { display: grid; gap: 12px; max-width: 360px; }
.tabs[hidden] { display: none; }
.pin input[type=password] { font-size: 1.6rem; letter-spacing: .4em; text-align: center; }
.err { padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.faces { display: flex; flex-wrap: wrap; gap: 6px; }
.faces button { font-size: 1.6rem; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 4px 8px; }
.faces button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ok-chip { color: var(--good); font-weight: 700; font-size: .88rem; }
footer.note { font-size: .8rem; color: var(--muted); margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Credit Quiz</h1><span>Ages 6–11 · Australia &amp; New Zealand</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabKid" aria-selected="true">Kid's game</button>
      <button role="tab" id="tabParent" aria-selected="false">Parent dashboard</button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="note">Progress is saved on this device only. Purchases are pretend for now.</footer>
</div>

umber", "text": "Split the number into tens and ones, multiply each, then add.", "example": "23 × 4 = (20 × 4) + (3 × 4) = 80 + 12 = 92."}, {"heading": "Dividing", "text": "Think: what times the small number makes the big one?", "example": "72 ÷ 8: 8 × 9 = 72, so the answer is 9."}]}, {"grade": 5, "subject": "maths", "title": "Fractions, decimals and bigger multiplying", "cards": [{"heading": "A fraction of a number", "text": "Divide by the bottom number, then multiply by the top number.", "example": "3/4 of 20: 20 ÷ 4 = 5, 5 × 3 = 15."}, {"heading": "Adding decimals", "text": "Line up the decimal points, then add like whole numbers.", "example": "2.4 + 3.7 = 6.1"}, {"heading": "Multiplying two-digit numbers", "text": "Split one number into tens and ones.", "example": "14 × 12 = (14 × 10) + (14 × 2) = 140 + 28 = 168."}]}, {"grade": 6, "subject": "maths", "title": "Percentages and negative numbers", "cards": [{"heading": "Percent means out of 100", "text": "10% is one tenth, 25% is one quarter, 50% is one half.", "example": "25% of 80 = 80 ÷ 4 = 20."}, {"heading": "Negative numbers", "text": "Numbers below zero are negative. Subtracting a bigger number takes you below zero.", "example": "5 − 8 = −3 (count back 8 from 5)."}, {"heading": "Order of operations", "text": "Multiply and divide before you add and subtract.", "example": "4 + 3 × 2 = 4 + 6 = 10, not 14."}]}, {"grade": 1, "subject": "english", "title": "Letters, sounds and sentences", "cards": [{"heading": "Letters make sounds", "text": "Every word is made of letter sounds. Say each sound, then blend them.", "example": "c-a-t makes 'cat'."}, {"heading": "Rhyming words", "text": "Words that rhyme end with the same sound.", "example": "cat, hat, mat, sat."}, {"heading": "Sentences", "text": "A sentence starts with a capital letter and ends with a full stop.", "example": "The dog is big."}]}, {"grade": 2, "subject": "english", "title": "Plurals, opposites and nouns", "cards": [{"heading": "More than one", "text": function numAnswers(right, spread, fmt = String, allowNeg = false) {
  const set = new Set([fmt(right)]);
  let guard = 0;
  while (set.size < 4 && guard++ < 200) {
    let w = right + (Math.random() < .5 ? -1 : 1) * rnd(1, spread);
    if (!allowNeg && w < 0) continue;
    set.add(fmt(w));
  }
  return [...set];
}

  pluralHard: [['child','children'],['foot','feet'],['tooth','teeth'],['man','men'],['leaf','leaves'],['mouse','mice'],['knife','knives'],['sheep','sheep']],

function wordQ(text, right, wrongs) {
  const set = [right, ...shuffle(wrongs.filter(w => w !== right)).filter((w, i, s) => s.indexOf(w) === i).slice(0, 3)];
  return set.length === 4 ? q('english', text, set) : null;
}
const ENGLISH = {
  plural: (list) => { const [w, p] = pick(list); return wordQ(`What is the plural of '${w}'?`, p, [w + 's', w + 'es', w.replace(/y$/, '') + 'ies', w + 'en', w]); },
  opposite: () => { const [a, b] = pick(W.opposite); const others = W.opposite.flat().filter(x => x !== a && x !== b); return wordQ(`What is the opposite of '${a}'?`, b, shuffle(others)); },
  past: () => { const [v, p] = pick(W.past); return wordQ(`What is the past tense of '${v}'?`, p, [v + 'ed', v + 's', v + 'ing', p + 'ed']); },
  synonym: () => { const [a, b] = pick(W.synonym); const others = W.synonym.flat().filter(x => x !== a && x !== b); return wordQ(`Which word means the same as '${a}'?`, b, shuffle(others)); },

  const opts = grade <= 2 ? [() => ENGLISH.plural(W.plural), ENGLISH.opposite]

    : [ENGLISH.past, ENGLISH.synonym, () => ENGLISH.plural(W.pluralHard)];
  return pick(opts)();
}

// Builds one game: fresh maths every time, generated English mixed in, and bank questions the child hasn't seen lately.
function buildGame(kid, subject) {
  const n = C().questionsPerGame, used = new Set(), recent = new Set(kid.recent), out = [];
  const subjects = subject === 'mix' ? BANK.subjects.map(s => s.id) : [subject];
  let guard = 0;
  while (out.length < n && guard++ < 400) {
    const s = pick(subjects);
    let item = null;
    if (s === 'maths') item = MATHS[kid.grade]();
    else if (s === 'english' && Math.random() < .5) item = genEnglish(kid.grade);
    if (!item) {
      const pool = BANK.questions.filter(x => x.subject === s && (x.region === 'all' || x.region === S.region) && (x.grade === kid.grade || x.grade === kid.grade - 1));
      const fresh = pool.filter(x => !recent.has(x.question) && !used.has(x.question));
      const from = fresh.length ? fresh : pool.filter(x => !used.has(x.question));
      if (!from.length) continue;
      // prefer the child's own grade over the review grade
      const own = from.filter(x => x.grade === kid.grade);
      item = pick(own.length && Math.random() < .75 ? own : from);
    }
    if (!item || used.has(item.question)) continue;
    used.add(item.question);
    out.push({ ...item, right: item.answers[0], shown: shuffle(item.answers) });
  }
  kid.recent = [...kid.recent, ...used].slice(-C().recentQuestionMemory);
  return out;
}

const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  return b64(await crypto.subtle.digest('SHA-256', data));
}
async function setPin(pin) { const salt = b64(randBytes(16)); S.parent = { salt, hash: await hashPin(pin, salt) }; save(); }

    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000, attestation: 'none' } });

}

  const res = await navigator.credentials.get({ publicKey: {
    challenge: randBytes(32), allowCredentials: [{ type: 'public-key', id: unb64(kid.cred) }],
    userVerification: 'required', timeout: 60000 } });

  document.getElementById('tabParent').setAttribute('aria-selected', t === 'parent');
  game = null;
  if (t === 'kid') { parentUnlocked = false; kidHome(); } else if (parentUnlocked) parentDash(); else parentLock();
}
document.getElementById('tabKid').onclick = () => setTab('kid');
document.getElementById('tabParent').onclick = () => setTab('parent');

function kidHome() {
  if (!S.kids.length) {
    view.innerHTML = `<section class="sheet"><h2 style="font-size:1.8rem">No players yet</h2>
      <p class="muted">A parent needs to add the children first.</p><button class="btn" id="goParent">Open the parent dashboard</button></section>`;
    document.getElementById('goParent').onclick = () => setTab('parent');
    return;
  }
  view.innerHTML = `<section class="sheet">
    <h2 style="font-size:1.8rem">Who is playing?</h2>
    <p class="muted" style="margin:4px 0 0">Tap your name, then touch the fingerprint sensor.</p>
    <div class="kids">${S.kids.map(k => `<button class="kidcard" data-kid="${k.id}">
        <span class="face">${k.face}</span><span class="name">${esc(k.name)}</span>
        <span><span class="chip grade">${yearOf(k.grade)}</span></span>${wallet(k)}</button>`).join('')}</div></section>`;
  view.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => fingerprint(S.kids.find(k => k.id === b.dataset.kid)));
}

function fingerprint(kid) {
  const canFinger = passkeyReady && kid.cred;
  view.innerHTML = `<section class="sheet"><div class="finger">
    <h2 style="font-size:1.8rem">Hi ${esc(kid.name)}! ${kid.face}</h2>
    ${canFinger
      ? `<button class="pad" id="pad" aria-label="Tap, then touch the fingerprint sensor">👆</button>
         <p class="muted" id="fpMsg">Tap the circle, then touch the fingerprint sensor.</p>`
      : `<p class="muted" id="fpMsg">${passkeyReady ? 'Your fingerprint isn\'t set up yet.' : 'This device or browser can\'t check fingerprints.'}<br>A parent can type the PIN to let you in.</p>`}
    <div class="row" style="justify-content:center"><button class="btn ghost" id="askParent">A parent will type the PIN</button><button class="btn ghost" id="back">Not me</button></div>
    <div id="pinBox"></div></div></section>`;
  document.getElementById('back').onclick = kidHome;
  document.getElementById('askParent').onclick = () => pinForm(document.getElementById('pinBox'), 'Parent PIN', () => pickSubject(kid));
  const pad = document.getElementById('pad');
  if (pad) pad.onclick = async () => {
    const msg = document.getElementById('fpMsg');
    pad.classList.add('scan'); pad.disabled = true; msg.textContent = 'Touch the sensor now…';
    try { if (await verifyKid(kid)) return pickSubject(kid); msg.textContent = 'That didn\'t work. Try again.'; }
    catch (e) { msg.textContent = 'That didn\'t work. Tap the circle to try again.'; }
    pad.classList.remove('scan'); pad.disabled = false;
  };
}

// A small PIN form that calls onOk when the parent PIN is right.
function pinForm(el, label, onOk) {
  el.innerHTML = `<form class="pin" style="margin-inline:auto">
    <label class="f" for="pinIn">${label}<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>
    <button class="btn">Unlock</button><div id="pinErr" aria-live="polite"></div></form>`;
  const input = el.querySelector('#pinIn'); input.focus();
  el.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    if (await checkPin(input.value)) onOk();
    else { el.querySelector('#pinErr').innerHTML = '<div class="err">Wrong PIN.</div>'; input.value = ''; input.focus(); }
  };
}

function parentLock() {
  view.innerHTML = `<section class="sheet"><h2 style="font-size:1.8rem">Parent dashboard</h2>
    <p class="muted">Type your parent PIN to open it.</p><div id="lockBox"></div></section>`;
  pinForm(document.getElementById('lockBox'), 'Parent PIN', () => { parentUnlocked = true; parentDash(); });
}

// First visit on this device: the parent makes a PIN and picks the curriculum.
function setup() {
  document.querySelector('.tabs').hidden = true;
  view.innerHTML = `<section class="sheet"><h2 style="font-size:1.9rem">Welcome to Credit Quiz</h2>
    <p class="muted" style="max-width:60ch">A parent sets this up once. Make a parent PIN (4 to 8 digits). Children can't open the parent dashboard without it.</p>
    <form class="pin" id="setupForm">
      <label class="f" for="p1">New parent PIN<input id="p1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>
      <label class="f" for="p2">Type it again<input id="p2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>
      <label class="f" for="reg">Curriculum<select id="reg">${Object.entries(C().regions).map(([id, r]) => `<option value="${id}">${r.name} (${r.curriculum})</option>`).join('')}</select></label>
      <label style="display:flex;gap:8px;align-items:center;font-size:.92rem"><input type="checkbox" id="demo"> Add two example children to try it out</label>
      <button class="btn">Save and continue</button><div id="setupErr" aria-live="polite"></div>
    </form></section>`;
  document.getElementById('setupForm').onsubmit = async (e) => {
    e.preventDefault();
    const a = document.getElementById('p1').value, b = document.getElementById('p2').value, err = document.getElementById('setupErr');
    if (!pinOk(a)) { err.innerHTML = '<div class="err">The PIN needs 4 to 8 digits.</div>'; return; }
    if (a !== b) { err.innerHTML = '<div class="err">The two PINs are different.</div>'; return; }
    if (document.getElementById('demo').checked) { const d = sampleState(); S.kids = d.kids; S.purchases = d.purchases; }
    S.region = document.getElementById('reg').value;
    await setPin(a);
    document.querySelector('.tabs').hidden = false;
    parentUnlocked = true; setTab('parent');
  };
}

async function boot() {
  await detectPasskeys();
  if (!S.parent) setup(); else kidHome();
}

function pickSubject(kid, note = '') {
  const cost = C().playCreditsPerGame, broke = kid.play < cost;
  view.innerHTML = `<section class="sheet">
    <div class="qhead"><div><div class="eyebrow">${yearOf(kid.grade)} · ${REG().name}</div><h2 style="font-size:1.8rem">What do you want to play, ${esc(kid.name)}?</h2></div>${wallet(kid)}</div>
    <div class="subjects">${BANK.subjects.map(s => `<button class="subj" data-s="${s.id}" ${broke ? 'disabled' : ''}><span class="ico">${s.emoji}</span>${s.name}</button>`).join('')}
      <button class="subj" data-s="mix" ${broke ? 'disabled' : ''}><span class="ico">🎲</span>Mix of everything</button></div>
    <div class="costline">${broke
      ? `<b>You're out of play credits.</b> Ask a parent to add more in the parent dashboard.`
      : `One game is <b>${C().questionsPerGame} questions</b> and costs <b>${cost} play credit${cost === 1 ? '' : 's'}</b>. Every right answer earns <b>★ ${C().rewardCreditsPerCorrectAnswer}</b>${C().perfectGameBonus ? `, and all right earns <b>★ ${C().perfectGameBonus} bonus</b>` : ''}.`}</div>
    ${note ? `<p class="muted">${note}</p>` : ''}
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="done">Finish playing</button></div></section>`;
  document.getElementById('done').onclick = kidHome;
  view.querySelectorAll('[data-s]').forEach(b => b.onclick = () => b.dataset.s === 'mix' ? startGame(kid, 'mix') : tutorial(kid, b.dataset.s, 0));
}

// Short lesson on the topics in this game. It's free: credits are only used when the game starts.
function tutorial(kid, subject, i) {
  const t = TUTORIALS.find(x => x.grade === kid.grade && x.subject === subject), s = SUBJ[subject], card = t.cards[i], last = i === t.cards.length - 1;
  const cost = C().playCreditsPerGame;
  view.innerHTML = `<section class="sheet">
    <div class="qhead"><span class="eyebrow">${s.emoji} ${s.name} · ${yearOf(kid.grade)} · Quick lesson</span>
      <span class="dots">${t.cards.map((_, j) => `<i class="${j < i ? 'ok' : j === i ? 'now' : ''}"></i>`).join('')}</span></div>
    <h2 class="lesson-title">${esc(t.title)}</h2>
    <div class="lesson">
      <h3>${esc(card.heading)}</h3>
      ${card.text ? `<p>${esc(card.text)}</p>` : ''}
      ${card.example ? `<div class="example"><span class="eyebrow">Example</span><p>${esc(card.example)}</p></div>` : ''}
    </div>
    <div class="row" style="margin-top:16px">
      ${i > 0 ? `<button class="btn ghost" id="prev">Back</button>` : ''}
      ${last ? `<button class="btn" id="go">I'm ready! Start the game (🎟 ${cost})</button>` : `<button class="btn" id="nextCard">Next</button>`}
      ${last ? '' : `<button class="btn ghost" id="skip">Skip to the game</button>`}
    </div></section>`;
  if (i > 0) document.getElementById('prev').onclick = () => tutorial(kid, subject, i - 1);
  if (last) document.getElementById('go').onclick = () => startGame(kid, subject);
  else { document.getElementById('nextCard').onclick = () => tutorial(kid, subject, i + 1); document.getElementById('skip').onclick = () => startGame(kid, subject); }
}

function startGame(kid, subject) {
  kid.play -= C().playCreditsPerGame;
  game = { kid, subject, qs: buildGame(kid, subject), i: 0, results: [] };
  save(); showQuestion();
}

function showQuestion() {
  const { kid, qs, i, results } = game, item = qs[i], s = SUBJ[item.subject];
  view.innerHTML = `<section class="sheet">
    <div class="qhead"><span class="eyebrow">${s.emoji} ${s.name} · Question ${i + 1} of ${qs.length}</span>
      <span class="dots">${qs.map((_, j) => `<i class="${j < i ? (results[j] ? 'ok' : 'no') : j === i ? 'now' : ''}"></i>`).join('')}</span></div>
    <p class="question">${esc(item.question)}</p>
    <div class="answers">${item.shown.map((a, j) => `<button class="ans" data-a="${j}">${esc(a)}</button>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="row"><span class="chip earn">★ ${results.filter(Boolean).length * C().rewardCreditsPerCorrectAnswer} this game</span></div></section>`;
  view.querySelectorAll('.ans').forEach(b => b.onclick = () => answer(+b.dataset.a));
}

function answer(j) {
  const item = game.qs[game.i], ok = item.shown[j] === item.right, kid = game.kid;
  game.results.push(ok);
  const st = kid.stats[item.subject] || (kid.stats[item.subject] = [0, 0]); st[1]++; if (ok) st[0]++;
  if (ok) kid.earned += C().rewardCreditsPerCorrectAnswer;
  view.querySelectorAll('.ans').forEach((b, k) => { b.disabled = true; if (item.shown[k] === item.right) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); });
  const fb = document.getElementById('fb');
  fb.className = 'feedback ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok ? `Right! +★ ${C().rewardCreditsPerCorrectAnswer}` : `Not quite. The answer is <b>${esc(item.right)}</b>.`;
  const last = game.i === game.qs.length - 1;
  fb.insertAdjacentHTML('afterend', `<div class="row" style="margin-top:6px"><button class="btn" id="next">${last ? 'See my score' : 'Next question'}</button></div>`);
  const next = document.getElementById('next'); next.focus();
  next.onclick = () => { if (last) finish(); else { game.i++; showQuestion(); } };
  save();
}

function finish() {
  const { kid, results, subject } = game, score = results.filter(Boolean).length, of = results.length;
  const perfect = score === of && C().perfectGameBonus > 0;
  if (perfect) kid.earned += C().perfectGameBonus;
  const earned = score * C().rewardCreditsPerCorrectAnswer + (perfect ? C().perfectGameBonus : 0);
  kid.games.unshift({ date: new Date().toISOString().slice(0, 10), subject, score, of, earned });
  save();
  view.innerHTML = `<section class="sheet"><div class="result">
    <div class="eyebrow">${subject === 'mix' ? '🎲 Mix' : SUBJ[subject].emoji + ' ' + SUBJ[subject].name}</div>
    <div class="big num">${score} / ${of}</div>
    <h2 style="font-size:1.6rem">${score === of ? 'Perfect game! 🎉' : score >= of / 2 ? 'Great work!' : 'Good try, keep going!'}</h2>
    <div class="coins" aria-label="${earned} credits earned">${'⭐'.repeat(Math.min(earned, 20)) || '·'}</div>
    <p>You earned <b>★ ${earned}</b>${perfect ? ` (including a ★ ${C().perfectGameBonus} perfect bonus)` : ''}. You now have <b>★ ${kid.earned}</b>.</p>
    ${wallet(kid)}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="done">Finish playing</button></div>
  </div></section>`;
  document.getElementById('again').onclick = () => pickSubject(kid, 'New questions every game.');
  document.getElementById('done').onclick = kidHome;
}

  document.getElementById('buyKid').onchange = (e) => { buy.kid = e.target.value; if (buy.pack) parentDash(); };
  if (pack) {
    document.getElementById('cancelBuy').onclick = () => { buy.pack = null; parentDash(); };
    document.getElementById('confirmBuy').onclick = () => {
      const kid = S.kids.find(k => k.id === (buy.kid || S.kids[0].id));
      kid.play += pack.credits;
      S.purchases.unshift({ date: new Date().toISOString().slice(0, 10), kid: kid.name, credits: pack.credits, price: pack.price });
      buy = { pack: null, kid: kid.id, msg: `Added ${pack.credits} play credits for ${esc(kid.name)}.` };
      save(); parentDash();
    };
  }
  view.querySelectorAll('[data-cfg]').forEach(i => i.onchange = () => { const v = Math.max(+i.min, Math.min(+i.max, Math.round(+i.value || 0))); cfg[i.dataset.cfg] = v; save(); parentDash(); });
  view.querySelectorAll('[data-pack-credits]').forEach(i => i.onchange = () => { cfg.creditPacks[+i.dataset.packCredits].credits = Math.max(1, Math.round(+i.value || 1)); save(); parentDash(); });
  view.querySelectorAll('[data-pack-price]').forEach(i => i.onchange = () => { cfg.creditPacks[+i.dataset.packPrice].price = Math.max(0, +i.value || 0); save(); parentDash(); });
  document.getElementById('region').onchange = (e) => { S.region = e.target.value; S.kids.forEach(k => k.recent = []); save(); parentDash(); };
  document.getElementById('pinChange').onsubmit = async (e) => {
    e.preventDefault(); const p = document.getElementById('newPin').value, m = document.getElementById('pinMsg');
    if (!pinOk(p)) { m.innerHTML = '<div class="err">The PIN needs 4 to 8 digits.</div>'; return; }
    await setPin(p); document.getElementById('newPin').value = ''; m.innerHTML = '<div class="toast">PIN changed.</div>';
  };
  document.getElementById('lock').onclick = () => setTab('kid');
  document.getElementById('reset').onclick = () => {
    const box = document.getElementById('resetBox');
    box.innerHTML = `<div class="confirm"><span>Erase all children, credits, scores and the PIN on this device? This can't be undone.</span>
      <div class="row"><button class="btn" id="yesReset">Erase everything</button><button class="btn ghost" id="noReset">Cancel</button></div></div>`;
    box.querySelector('#noReset').onclick = () => { box.innerHTML = ''; };
    box.querySelector('#yesReset').onclick = () => { S = freshState(); buy = { pack: null, kid: null, msg: '' }; parentUnlocked = false; save(); setup(); };
  };
}

boot();
</script>
</body>
</html>
