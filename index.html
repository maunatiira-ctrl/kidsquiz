<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Quiz</title>
<meta name="description" content="A quiz game for kids aged 6 to 11, following the Australian and New Zealand curriculum.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: school-crest look. A maroon header band on a clean white page; white cards with fine borders; gold only for earned stars. */
:root {
  --paper: #faf7f7;
  --rule: #f1e9ea;
  --card: #ffffff;
  --ink: #2a1a1d;
  --muted: #6e5a5e;
  --line: #e7dadc;
  --accent: #7b1e2e;      /* maroon */
  --accent-soft: #f7e9eb;
  --brand: #7b1e2e;       /* header band */
  --brand-ink: #ffffff;
  --crayon: #d9a426;      /* gold for earned credits */
  --crayon-ink: #6b4a00;
  --good: #1e7a4c; --good-soft: #def1e6;
  --bad: #b3261e; --bad-soft: #fbe4e2;
  --display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #161012; --rule: #1f1719; --card: #1f1619; --ink: #f4eaec; --muted: #b9a5a9; --line: #3a2a2e;
  --accent: #e8a3ad; --accent-soft: #3a1f25; --brand: #5c1522; --brand-ink: #ffffff; --crayon: #f0c25a; --crayon-ink: #f0c25a;
  --good: #6fd3a0; --good-soft: #17352a; --bad: #f19a92; --bad-soft: #3d1f1d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #161012; --rule: #1f1719; --card: #1f1619; --ink: #f4eaec; --muted: #b9a5a9; --line: #3a2a2e;
  --accent: #e8a3ad; --accent-soft: #3a1f25; --brand: #5c1522; --brand-ink: #ffffff; --crayon: #f0c25a; --crayon-ink: #f0c25a;
  --good: #6fd3a0; --good-soft: #17352a; --bad: #f19a92; --bad-soft: #3d1f1d; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.5; color: var(--ink);
  background: var(--paper);
}
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; }
.brand h1 { white-space: nowrap; }
.brand h1 { font-size: 1.75rem; font-weight: 700; color: var(--brand-ink); letter-spacing: -.01em; }
.brand span { color: color-mix(in srgb, var(--brand-ink) 78%, transparent); font-size: .9rem; }
header.top { background: var(--brand); color: var(--brand-ink); border-radius: 18px; padding: 14px 18px; margin-bottom: 18px; box-shadow: 0 6px 20px -12px rgba(60, 10, 20, .6); }
.tabs { display: inline-flex; flex-wrap: wrap; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; color: var(--brand-ink); opacity: .85; }
.tabs button[aria-selected="true"] { background: #ffffff; color: #7b1e2e; opacity: 1; }
.tabs button:focus-visible { outline-color: #ffffff; }
.gender { display: flex; gap: 8px; flex-wrap: wrap; }
.gender button { flex: 1; min-width: 110px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; }
.gender button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.sample { font-size: .85rem; color: var(--muted); margin: 0 0 18px; }
.sample b { color: var(--ink); }

.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 700; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- kid side ---------- */
.kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.kidcard { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 18px; display: grid; gap: 6px; }
.kidcard:hover { border-color: var(--accent); }
.kidcard .face { font-size: 2.4rem; line-height: 1; }
.kidcard .name { font-family: var(--display); font-size: 1.5rem; font-weight: 700; }
.wallet { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.play { background: var(--accent-soft); color: var(--accent); }
.chip.earn { background: color-mix(in srgb, var(--crayon) 22%, transparent); color: var(--crayon-ink); }
.chip.grade { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }

.finger { display: grid; justify-items: center; gap: 12px; padding: 24px 0; text-align: center; }
.pad { width: 120px; height: 120px; border-radius: 50%; border: 3px dashed var(--accent); background: var(--accent-soft); font-size: 3.4rem; display: grid; place-items: center; }
.pad.scan { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .pad.scan { animation: none; } }

.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.subj { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px 12px; display: grid; justify-items: center; gap: 4px; font-weight: 700; }
.subj:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.subj:disabled { opacity: .45; cursor: not-allowed; }
.subj .ico { font-size: 2rem; }
.costline { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--paper); border: 1px dashed var(--line); font-size: .92rem; }

.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots i.ok { background: var(--good); } .dots i.no { background: var(--bad); } .dots i.now { background: var(--accent); }
.question { font-family: var(--display); font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; margin: 22px 0; text-wrap: balance; }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.ans { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px; font-size: 1.15rem; font-weight: 700; text-align: left; min-height: 64px; }
.ans:hover:not(:disabled) { border-color: var(--accent); }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.ans:disabled { cursor: default; }
.feedback { min-height: 2em; margin-top: 14px; font-weight: 700; font-size: 1.1rem; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }

.result { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.result .big { font-family: var(--display); font-size: 3.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
.coins { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; font-size: 2rem; }

.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent-soft); }
.btn.gold { background: var(--crayon); color: #3d2a00; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- parent side ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel h2 { font-size: 1.3rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--paper); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(0, 1.3fr) 1fr 44px; gap: 8px; align-items: center; font-size: .88rem; }
.bar .track { display: block; height: 10px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar .fill.lo { background: var(--bad); } .bar .fill.mid { background: var(--crayon); } .bar .fill.hi { background: var(--good); }
.packs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.pack { border: 2px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px; display: grid; gap: 2px; text-align: left; }
.pack:hover { border-color: var(--accent); }
.pack b { font-family: var(--display); font-size: 1.4rem; }
.pack[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
label.f { display: grid; gap: 4px; font-size: .88rem; font-weight: 700; }
select, input[type=number] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
.cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; }
.tablewrap { overflow-x: auto; }
.lesson-title { font-size: 1.9rem; margin: 18px 0 12px; color: var(--accent); }
.lesson { display: grid; gap: 10px; max-width: 62ch; }
.lesson h3 { font-size: 1.45rem; }
.lesson p { margin: 0; font-size: 1.15rem; }
.example { border: 2px dashed var(--crayon); border-radius: 14px; padding: 12px 16px; background: color-mix(in srgb, var(--crayon) 10%, var(--card)); display: grid; gap: 4px; }
.example p { font-family: var(--display); font-size: 1.3rem; font-weight: 700; }
.toast { padding: 10px 14px; border-radius: 10px; background: var(--good-soft); color: var(--good); font-weight: 700; }
.confirm { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; background: var(--accent-soft); display: grid; gap: 8px; }
@media (max-width: 480px) { .sheet { padding: 18px; } .bar { grid-template-columns: minmax(0, 1.4fr) 1fr 40px; } .stats { grid-template-columns: repeat(3, minmax(0,1fr)); } }
input[type=text], input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
.pin { display: grid; gap: 12px; max-width: 360px; }
.tabs[hidden], .tabs button[hidden] { display: none; }
input[type=email], input[type=number], input[type=tel] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; }
.packrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.packrow input { padding: 8px 6px; min-width: 0; }
.packrow .btn { padding-inline: 10px; }
.acct { display: grid; gap: 10px; max-width: 420px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.info { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card); color: var(--accent); font: italic 800 1.05rem Georgia, serif; cursor: pointer; flex: none; }
.info[aria-expanded="true"] { background: var(--accent); color: var(--card); }
.bankinfo[hidden] { display: none; }
.bankinfo { border: 2px dashed var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; background: var(--accent-soft); }
.kv { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kv span { color: var(--muted); }
.kv b { overflow-wrap: anywhere; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.seg button[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.err-text { color: var(--bad); font-weight: 700; }
.reqs { display: grid; gap: 10px; }
.req { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.hostalert { display: block; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: var(--crayon); color: #2a1a1d; font-weight: 700; text-decoration: none; }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.pin input[type=password] { font-size: 1.6rem; letter-spacing: .4em; text-align: center; }
.err { padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.faces { display: flex; flex-wrap: wrap; gap: 6px; }
.faces button { font-size: 1.6rem; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 4px 8px; }
.faces button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ok-chip { color: var(--good); font-weight: 700; font-size: .88rem; }
footer.note { font-size: .8rem; color: var(--muted); margin-top: 24px; text-align: center; }
/* ---------- reading test ---------- */
.passage { font-family: var(--body); font-size: clamp(1.25rem, 3.2vw, 1.6rem); line-height: 1.9; max-width: 62ch; margin: 18px 0 8px; }
.passage p { margin: 0 0 .9em; }
.passage.g1, .passage.g2 { font-size: clamp(1.45rem, 4vw, 1.9rem); line-height: 2; }
.w { border-radius: 6px; padding: 1px 2px; margin: 0 -2px; cursor: pointer; transition: background .2s, color .2s; }
.w:hover { background: var(--accent-soft); }
.w.gl { text-decoration: underline dotted var(--accent) 2px; text-underline-offset: 5px; }
.w.heard { background: var(--good-soft); color: var(--good); }
.w.miss { background: var(--bad-soft); color: var(--bad); text-decoration: underline wavy var(--bad) 1.5px; text-underline-offset: 5px; }
.w.skip { color: var(--ink); }
.count { font-family: var(--display); font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; color: var(--accent); line-height: 1; text-align: center; margin: 30px 0; }
.count.go { color: var(--good); }
.listening { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--bad); }
.listening i { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .listening i { animation: none; } }
.practice { display: grid; gap: 10px; margin-top: 12px; }
.pw { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.pw b { font-family: var(--display); font-size: 1.5rem; flex: 1; min-width: 120px; }
.pw .btn { padding: 8px 14px; }
.pw .ok-chip { font-size: 1rem; }
.scorebar { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.scorebar .stat { min-width: 120px; }
.popwrap { position: fixed; inset: 0; background: rgb(10 15 30 / .45); display: grid; place-items: end center; padding: 16px; z-index: 50; }
@media (min-width: 640px) { .popwrap { place-items: center; } }
.pop { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 20px; padding: 20px; width: min(520px, 100%); display: grid; gap: 10px; box-shadow: 0 10px 40px rgb(0 0 0 / .25); max-height: 90vh; overflow: auto; }
.pop h3 { font-size: 2rem; color: var(--accent); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pop .mean { font-size: 1.2rem; margin: 0; }
.pop ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 1.1rem; }
.pop ol li::marker { color: var(--crayon-ink); font-weight: 700; }
.iconbtn { border: 2px solid var(--accent-soft); background: var(--card); color: var(--accent); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 1rem; }
details.peek { margin-top: 16px; border: 1px dashed var(--line); border-radius: 12px; padding: 8px 14px; }
details.peek summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.peek .passage { font-size: 1.05rem; line-height: 1.7; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Credit Quiz</h1><span>Ages 6–11 · Australia &amp; New Zealand</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabKid" aria-selected="true">Kid's game</button>
      <button role="tab" id="tabParent" aria-selected="false">Parent dashboard</button>
      <button role="tab" id="tabHost" aria-selected="false" hidden>Host</button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="note" id="footNote"></footer>
</div>

umber", "text": "Split the number into tens and ones, multiply each, then add.", "example": "23 × 4 = (20 × 4) + (3 × 4) = 80 + 12 = 92."}, {"heading": "Dividing", "text": "Think: what times the small number makes the big one?", "example": "72 ÷ 8: 8 × 9 = 72, so the answer is 9."}]}, {"grade": 5, "subject": "maths", "title": "Fractions, decimals and bigger multiplying", "cards": [{"heading": "A fraction of a number", "text": "Divide by the bottom number, then multiply by the top number.", "example": "3/4 of 20: 20 ÷ 4 = 5, 5 × 3 = 15."}, {"heading": "Adding decimals", "text": "Line up the decimal points, then add like whole numbers.", "example": "2.4 + 3.7 = 6.1"}, {"heading": "Multiplying two-digit numbers", "text": "Split one number into tens and ones.", "example": "14 × 12 = (14 × 10) + (14 × 2) = 140 + 28 = 168."}]}, {"grade": 6, "subject": "maths", "title": "Percentages and negative numbers", "cards": [{"heading": "Percent means out of 100", "text": "10% is one tenth, 25% is one quarter, 50% is one half.", "example": "25% of 80 = 80 ÷ 4 = 20."}, {"heading": "Negative numbers", "text": "Numbers below zero are negative. Subtracting a bigger number takes you below zero.", "example": "5 − 8 = −3 (count back 8 from 5)."}, {"heading": "Order of operations", "text": "Multiply and divide before you add and subtract.", "example": "4 + 3 × 2 = 4 + 6 = 10, not 14."}]}, {"grade": 1, "subject": "english", "title": "Letters, sounds and sentences", "cards": [{"heading": "Letters make sounds", "text": "Every word is made of letter sounds. Say each sound, then blend them.", "example": "c-a-t makes 'cat'."}, {"heading": "Rhyming words", "text": "Words that rhyme end with the same sound.", "example": "cat, hat, mat, sat."}, {"heading": "Sentences", "text": "A sentence starts with a capital letter and ends with a full stop.", "example": "The dog is big."}]}, {"grade": 2, "subject": "english", "title": "Plurals, opposites and nouns", "cards": [{"heading": "More than one", "text": "Add 's' to most words. Add 'es' after s, x, sh or ch.", "example": "cat → cats, box → boxes."}, {"heading": "Opposites", "text": "Opposites mean completely different things.", "example": "big ↔ small, hot ↔ cold."}, {"heading": "Nouns are naming words", "text": "A noun names a person, place, animal or thing.", "example": "Mum, park, dog, table."}]}, {"grade": 3, "subject": "english", "title": "Verbs, adjectives and tricky plurals", "cards": [{"heading": "Verbs are doing words", "text": "A verb tells what someone does.", "example": "jump, swim, read."}, {"heading": "Past tense", "text": "Most verbs add 'ed', but some change completely.", "example": "walk → walked, but run → ran, go → went."}, {"heading": "Adjectives describe", "text": "An adjective tells more about a noun.", "example": "a soft, fluffy cat."}]}, {"grade": 4, "subject": "english", "title": "Adverbs, homophones and apostrophes", "cards": [{"heading": "Adverbs", "text": "An adverb tells how something is done. Many end in 'ly'.", "example": "She sang quietly."}, {"heading": "Homophones", "text": "Words that sound the same but mean different things.", "example": "sea / see, there / their / they're."}, {"heading": "Apostrophes show ownership", "text": "Add 's to show something belongs to someone.", "example": "Mia's hat = the hat that belongs to Mia."}]}, {"grade": 5, "subject": "english", "title": "Synonyms, pronouns and figurative language", "cards": [{"heading": "Synonyms", "text": "Words that mean nearly the same. Use them to make writing interesting.", "example": "big → enormous, huge, large."}, {"heading": "Pronouns", "text": "Pronouns replace nouns so we don't repeat them.", "example": "Sam is tall. He plays basketball."}, {"heading": "Personification", "text": "Giving human actions to things that aren't human.", "example": "The wind whispered through the trees."}]}, {"grade": 6, "subject": "english", "title": "Similes, metaphors and the passive voice", "cards": [{"heading": "Similes compare using 'like' or 'as'", "text": "", "example": "as brave as a lion, ran like the wind."}, {"heading": "Metaphors say something IS something else", "text": "", "example": "The classroom was a zoo."}, {"heading": "Active and passive voice", "text": "Active: the doer comes first. Passive: the action happens to something.", "example": "Sam ate the cake. → The cake was eaten by Sam."}]}, {"grade": 1, "subject": "health", "title": "Keeping my body healthy", "cards": [{"heading": "Eat healthy food", "text": "Fruit and vegetables give you energy to play and learn.", "example": "Choose an apple instead of lollies."}, {"heading": "Keep clean", "text": "Wash your hands with soap before eating and after the toilet.", "example": "Sing 'Happy Birthday' twice while you wash."}, {"heading": "Stay safe", "text": "Before crossing the road: stop, look and listen. Wear a hat in the sun.", "example": "Hold a grown-up's hand near roads."}]}, {"grade": 2, "subject": "health", "title": "Safe in the sun, safe in the water", "cards": [{"heading": "Slip, Slop, Slap, Seek, Slide", "text": "Slip on a shirt, slop on sunscreen, slap on a hat, seek shade, slide on sunglasses.", "example": "Sunscreen goes on 20 minutes before going out."}, {"heading": "Swim between the flags", "text": "At the beach, swim between the red and yellow flags where lifesavers watch.", "example": "If you get into trouble, raise your arm and wave."}, {"heading": "Feelings", "text": "Everyone feels sad or angry sometimes. Talk to someone you trust.", "example": "Tell a parent, teacher or friend."}]}, {"grade": 3, "subject": "health", "title": "Teeth, sleep and staying safe", "cards": [{"heading": "Healthy teeth", "text": "Brush for about two minutes, twice a day. Soft drinks have lots of sugar.", "example": "Water is the best drink for teeth."}, {"heading": "Sleep", "text": "Kids need 9 to 12 hours of sleep each night to grow and learn.", "example": "Put screens away before bed."}, {"heading": "Emergencies", "text": "In Australia call 000. In New Zealand call 111.", "example": "Tell them your name, where you are and what happened."}]}, {"grade": 4, "subject": "health", "title": "Healthy choices and kind friends", "cards": [{"heading": "Five serves of veg", "text": "Try to eat at least five serves of vegetables and fruit every day.", "example": "Add carrot sticks to your lunchbox."}, {"heading": "Bullying", "text": "Bullying is hurting someone again and again on purpose.", "example": "If you see it, tell a teacher or a trusted adult."}, {"heading": "Food labels", "text": "The nutrition panel shows how much sugar, salt and fat a food has.", "example": "Compare two cereals and pick the lower sugar one."}]}, {"grade": 5, "subject": "health", "title": "Growing up and staying safe online", "cards": [{"heading": "Your body", "text": "Your lungs breathe, your heart pumps blood, and sunlight helps your body make vitamin D.", "example": "Being active for 60 minutes a day keeps your body strong."}, {"heading": "Peer pressure and consent", "text": "You can say no if friends push you to do something that feels wrong. Consent means giving permission.", "example": "'No thanks, I don't want to.'"}, {"heading": "Online safety", "text": "Keep passwords and personal details private.", "example": "Never share your address or school online."}]}, {"grade": 6, "subject": "health", "title": "Mind, body and first aid", "cards": [{"heading": "Mental health", "text": "Talking about feelings, exercise and good sleep help you manage stress.", "example": "Take a walk or talk to someone when you feel worried."}, {"heading": "Your immune system", "text": "White blood cells fight germs. Fibre, water and good food keep you well.", "example": "Wholegrain bread is high in fibre."}, {"heading": "First aid", "text": "First aid is help given before a doctor arrives.", "example": "DRSABCD: Danger, Response, Send for help, Airway, Breathing, CPR, Defibrillator."}]}, {"grade": 1, "subject": "science", "title": "Living things and the world around us", "cards": [{"heading": "Animals", "text": "Animals move, eat and grow. Some fly, some swim, some walk.", "example": "A joey grows in its mother's pouch."}, {"heading": "Plants", "text": "Plants need water, sunlight and air to grow.", "example": "A seed grows into a plant."}, {"heading": "Materials", "text": "Things are made of materials like glass, wood and metal.", "example": "Glass is see-through, so we use it for windows."}]}, {"grade": 2, "subject": "science", "title": "Life cycles, pushes and pulls", "cards": [{"heading": "Life cycles", "text": "Living things change as they grow.", "example": "egg → caterpillar → chrysalis → butterfly."}, {"heading": "Pushes and pulls", "text": "A push or pull can make something move, stop or change shape.", "example": "Kicking a ball is a push."}, {"heading": "Float or sink", "text": "Light things like corks float. Heavy, solid things like rocks sink.", "example": "A coin sinks; a leaf floats."}]}, {"grade": 3, "subject": "science", "title": "States of matter and our Earth", "cards": [{"heading": "Solid, liquid, gas", "text": "Matter can be a solid (ice), a liquid (water) or a gas (steam).", "example": "Heating ice makes water; heating water makes steam."}, {"heading": "Day and night", "text": "The Earth spins around once every 24 hours. When your side faces the Sun, it's day.", "example": "When it's day in Australia, it's night in England."}, {"heading": "Fair tests", "text": "Change only one thing at a time so you know what caused the result.", "example": "Same plants, same soil, but different amounts of water."}]}, {"grade": 4, "subject": "science", "title": "Forces, food chains and the land", "cards": [{"heading": "Friction", "text": "Friction is a force that slows things down when surfaces rub.", "example": "Rough carpet slows a toy car more than smooth tiles."}, {"heading": "Food chains", "text": "Energy passes from plants to animals that eat them.", "example": "grass → rabbit → fox"}, {"heading": "Erosion", "text": "Wind and water slowly wear away rock and soil.", "example": "Waves shape cliffs along the coast."}]}, {"grade": 5, "subject": "science", "title": "Space, light and plants", "cards": [{"heading": "Our solar system", "text": "Earth goes around the Sun once a year (about 365 days). Jupiter is the biggest planet.", "example": "The Moon reflects the Sun's light."}, {"heading": "Photosynthesis", "text": "Plants use sunlight, water and carbon dioxide to make food and oxygen.", "example": "That's why leaves face the Sun."}, {"heading": "Light travels in straight lines", "text": "When light is blocked, it makes a shadow.", "example": "Your shadow is longer in the late afternoon."}]}, {"grade": 6, "subject": "science", "title": "Electricity and changes", "cards": [{"heading": "Circuits", "text": "Electricity needs a complete loop called a circuit. A switch opens or closes it.", "example": "Battery → wire → globe → wire → back to battery."}, {"heading": "Conductors and insulators", "text": "Metals like copper let electricity flow. Rubber and plastic stop it.", "example": "Wires are copper inside, plastic outside."}, {"heading": "Reversible and irreversible changes", "text": "Melting ice can be undone; burning paper can't.", "example": "Cooking an egg is irreversible."}]}, {"grade": 1, "subject": "social", "title": "People and places around me", "cards": [{"heading": "Helpers in our community", "text": "Doctors, firefighters, teachers and librarians help us every day.", "example": "Firefighters put out fires."}, {"heading": "Family", "text": "Our family might include parents, grandparents, brothers, sisters and cousins.", "example": "In te reo Māori, family is 'whānau'."}, {"heading": "Special symbols", "text": "Countries have special animals and days.", "example": "Australia: the kangaroo. New Zealand: the kiwi."}]}, {"grade": 2, "subject": "social", "title": "First peoples and special places", "cards": [{"heading": "First peoples", "text": "Aboriginal and Torres Strait Islander peoples were the first people of Australia. Māori were the first people to settle Aotearoa New Zealand.", "example": "'Aotearoa' is the Māori name for New Zealand."}, {"heading": "Maps", "text": "A map shows where places are, from above.", "example": "Find your school on a map of your town."}, {"heading": "Remembering", "text": "On Anzac Day (25 April) Australia and New Zealand remember people who served in wars.", "example": "Many people go to a dawn service."}]}, {"grade": 3, "subject": "social", "title": "Our country and the world", "cards": [{"heading": "Continents and oceans", "text": "There are 7 continents and 5 oceans. The Pacific is the biggest ocean.", "example": "Australia is both a country and a continent."}, {"heading": "Capital cities", "text": "Australia's capital is Canberra. New Zealand's capital is Wellington.", "example": "Australia has 6 states; New Zealand has two main islands."}, {"heading": "Compass directions", "text": "North is usually at the top of a map.", "example": "Never Eat Soggy Weet-Bix: North, East, South, West."}]}, {"grade": 4, "subject": "social", "title": "Explorers and the environment", "cards": [{"heading": "Explorers", "text": "Abel Tasman reached New Zealand in 1642. James Cook mapped Australia's east coast in 1770.", "example": "The First Fleet arrived in Sydney Cove in 1788."}, {"heading": "Natural wonders", "text": "The Great Barrier Reef and Aoraki / Mount Cook are special natural places.", "example": "Aoraki is New Zealand's highest mountain."}, {"heading": "Caring for the environment", "text": "People can protect places by reducing waste and looking after land and water.", "example": "Pick up litter at the beach."}]}, {"grade": 5, "subject": "social", "title": "How our nations began", "cards": [{"heading": "Colonies", "text": "A colony is a place ruled by another country. Australia and New Zealand were British colonies.", "example": "The six Australian colonies joined in 1901 (Federation)."}, {"heading": "Treaty of Waitangi", "text": "Te Tiriti o Waitangi was first signed in 1840 by Māori chiefs and the British Crown.", "example": "Waitangi Day is on 6 February."}, {"heading": "Democracy", "text": "In a democracy people vote to choose their leaders.", "example": "In 1893 New Zealand women were the first in the world to vote in national elections."}]}, {"grade": 6, "subject": "social", "title": "Government and rights", "cards": [{"heading": "How we're governed", "text": "Both countries have a Parliament and a Prime Minister. Australia has federal, state and local government.", "example": "New Zealand's Parliament building is called the Beehive."}, {"heading": "Voting", "text": "New Zealand uses MMP to elect Parliament. Australians vote in referendums to change the Constitution.", "example": "Voting is compulsory in Australia from age 18."}, {"heading": "Human rights and the world", "text": "Human rights are rights every person should have. The United Nations helps countries keep peace.", "example": "Everyone has the right to an education."}]}];

, and it is so big that astronauts can see it from space.", "A reef might look like rock, but it is built by tiny animals called coral polyps. Each polyp makes a hard shell around its soft body. Over thousands of years, millions of these shells join together to make the reef.", "The reef is home to colourful fish, sea turtles, sharks and giant clams. Sadly, the reef is in danger. When the ocean gets too warm, the coral turns white and can die. This is called coral bleaching. Scientists are working hard to protect the reef so it stays healthy for the future."], "glossary": [{"words": ["coast"], "meaning": "The land right next to the sea.", "examples": ["We drove along the coast.", "There are many beaches on the coast."]}, {"words": ["reef"], "meaning": "A long line of rock or coral in the sea, close to the surface.", "examples": ["Fish swim around the reef.", "The boat almost hit the reef."]}, {"words": ["largest"], "meaning": "The biggest of all.", "examples": ["The blue whale is the largest animal.", "This is the largest cake I've ever seen."]}, {"words": ["coral"], "meaning": "A hard, colourful thing in the sea made by tiny animals.", "examples": ["The coral was pink and orange.", "Fish hide in the coral."]}, {"words": ["astronauts"], "meaning": "People who travel into space.", "examples": ["The astronauts flew to the space station.", "Astronauts float when they are in space."]}, {"words": ["polyps", "polyp"], "meaning": "Tiny soft sea animals that build coral.", "examples": ["Coral polyps are smaller than a pea.", "Each polyp makes its own shell."]}, {"words": ["thousands"], "meaning": "A very large number. One thousand is ten hundreds.", "examples": ["Thousands of people watched the game.", "There are thousands of stars in the sky."]}, {"words": ["millions"], "meaning": "A huge number. One million is a thousand thousands.", "examples": ["Millions of people live in Sydney.", "There are millions of grains of sand on the beach."]}, {"words": ["colourful"], "meaning m", "coral growing very fast", "fish cleaning the coral", "coral turning blue at night"]}, {"question": "What are scientists doing for the reef?", "answers": ["working hard to protect it", "building a new reef", "catching all the sharks", "painting the coral"]}]}, {"grade": 3, "region": "all", "title": "Mia's Lost Library Book", "paragraphs": ["Mia borrowed a book about dragons from the school library. She loved it so much that she read it every night under her blanket with a torch.", "On Friday, the book was due back, but Mia could not find it anywhere. She searched under her bed, inside her schoolbag and behind the couch. Her little brother Theo shook his head when she asked him.", "Mia felt worried. She went to the librarian, Mr Patel, and told him the truth. \"Thank you for being honest,\" he said kindly. \"Keep looking, and bring it back when you find it.\"", "That afternoon, Mia's dog, Biscuit, trotted into the lounge room with something in his mouth. It was the dragon book! It was a bit soggy, but every page was still there."], "glossary": [{"words": ["borrowed"], "meaning": "Took something for a while, and promised to give it back.", "examples": ["I borrowed a pencil from my friend.", "We borrowed three books from the library."]}, {"words": ["library"], "meaning": "A place with lots of books that you can read or borrow.", "examples": ["Our class visits the library on Tuesday.", "The library is very quiet."]}, {"words": ["torch"], "meaning": "A small light you hold in your hand that runs on batteries.", "examples": ["We used a torch when the power went out.", "Take a torch when you go camping."]}, {"words": ["due"], "meaning": "When something must be given back or finished.", "examples": ["My homework is due on Monday.", "The library books are due back today."]}, {"words": ["searched"], "meaning": "Looked carefully for something.", "examples": ["We searched the park for the lost ball.", "She searched her pockets for the key."]}, {"words": ["worried"], "meanin ion": "What was the book like when it came back?", "answers": ["a bit soggy, but every page was there", "torn in half", "missing lots of pages", "covered in paint"]}]}, {"grade": 3, "region": "all", "title": "Matariki", "paragraphs": ["In the middle of winter, a small group of stars rises in the early morning sky over New Zealand. This star cluster is called {Matariki}. When {Matariki} appears, it marks the start of the Māori New Year.", "Long ago, people looked at the stars to decide when to plant and harvest food. If the stars looked bright and clear, they thought the coming year would be warm and the crops would grow well.", "Today, {Matariki} is a public holiday. Families and friends gather to remember people who have died, celebrate the present, and plan for the future. They share food, sing songs, fly kites and watch the stars together."], "glossary": [{"words": ["Matariki"], "meaning": "A group of stars that marks the Māori New Year in New Zealand.", "examples": ["We stayed up early to see Matariki.", "Our school had a Matariki celebration."]}, {"words": ["cluster"], "meaning": "A small group of things close together.", "examples": ["A cluster of grapes hung from the vine.", "The ants made a cluster around the crumb."]}, {"words": ["appears"], "meaning": "Comes into view, so you can see it.", "examples": ["A rainbow appears after the rain.", "The moon appears at night."]}, {"words": ["Māori", "Maori"], "meaning": "The first people of New Zealand, and their language.", "examples": ["We learnt a Māori song at school.", "Kia ora is a Māori greeting."]}, {"words": ["harvest"], "meaning": "To pick or collect crops when they are ready.", "examples": ["The farmers harvest the wheat in summer.", "We harvest apples from our tree."]}, {"words": ["crops"], "meaning": "Plants grown by farmers for food.", "examples": ["Rain helps the crops grow.", "The farmer's crops were corn and potatoes."]}, {"words": ["holiday"], "meaning": "A day when people don't go to school or work.", "examples": ["Christmas Day is a holiday.", "We went camping on the holiday."]}, {"words": ["gather"], "meaning": "To come together in one place.", "examples": ["We gather on the mat for story time.", "Clouds gather before a storm."]}, {"words": ["celebrate"], "meaning": "To do something fun and special for an important day.", "examples": ["We celebrate birthdays with cake.", "The team will celebrate the win."]}, {"words": ["present"], "meaning": "Now, this time. It can also mean a gift.", "examples": ["Live in the present and enjoy today.", "I got a present for my birthday."]}], "questions": [{"question": "When does Matariki rise in the sky?", "answers": ["in the middle of winter", "in the middle of summer", "at lunch time", "every night of the year"]}, {"question": "What is Matariki?", "answers": ["a small group of stars", "a big mountain", "a type of bird", "a song"]}, {"question": "What does Matariki mark the start of?", "answers": ["the Māori New Year", "the school holidays", "summer", "the football season"]}, {"question": "Long ago, why did people look at the stars?", "answers": ["to decide when to plant and harvest food", "to tell the time for school", "to find lost keys", "to count their sheep"]}, {"question": "What did bright, clear stars mean to people long ago?", "answers": ["a warm year with good crops", "a cold and hungry year", "lots of rain", "a big storm"]}, {"question": "What do people do at Matariki today?", "answers": ["share food, sing songs and fly kites", "go back to school", "stay inside alone", "go to the beach to swim"]}, {"question": "Who do families remember at Matariki?", "answers": ["people who have died", "their teachers", "famous singers", "their first pets"]}]}, {"grade": 4, "region": "all", "title": "A Drop's Journey", "paragraphs": ["Every drop of water on Earth is on a journey that never ends. Imagine a drop of water floating in the ocean. When the sun heats the ocean, the drop turns into an invisible gas called water vapour.   opposite: [['hot','cold'],['up','down'],['happy','sad'],['fast','slow'],['open','closed'],['full','empty'],['light','dark'],['early','late'],['loud','quiet'],['wet','dry'],['hard','soft'],['strong','weak'],['tall','short'],['first','last']],
  past: [['go','went'],['see','saw'],['eat','ate'],['swim','swam'],['take','took'],['write','wrote'],['buy','bought'],['think','thought'],['teach','taught'],['catch','caught'],['bring','brought'],['sing','sang'],['drink','drank'],['fly','flew'],['give','gave']],
  synonym: [['big','large'],['small','tiny'],['quick','fast'],['angry','furious'],['smart','clever'],['begin','start'],['end','finish'],['scared','afraid'],['shout','yell'],['brave','courageous'],['hard','difficult'],['look','glance'],['happy','cheerful']],
};
function wordQ(text, right, wrongs) {
  const set = [right, ...shuffle(wrongs.filter(w => w !== right)).filter((w, i, s) => s.indexOf(w) === i).slice(0, 3)];
  return set.length === 4 ? q('english', text, set) : null;
}
const ENGLISH = {
  plural: (list) => { const [w, p] = pick(list); return wordQ(`What is the plural of '${w}'?`, p, [w + 's', w + 'es', w.replace(/y$/, '') + 'ies', w + 'en', w]); },
  opposite: () => { const [a, b] = pick(W.opposite); const others = W.opposite.flat().filter(x => x !== a && x !== b); return wordQ(`What is the opposite of '${a}'?`, b, shuffle(others)); },
  past: () => { const [v, p] = pick(W.past); return wordQ(`What is the past tense of '${v}'?`, p, [v + 'ed', v + 's', v + 'ing', p + 'ed']); },
  synonym: () => { const [a, b] = pick(W.synonym); const others = W.synonym.flat().filter(x => x !== a && x !== b); return wordQ(`Which word means the same as '${a}'?`, b, shuffle(others)); },
};
function genEnglish(grade) {
  const opts = grade <= 2 ? [() => ENGLISH.plural(W.plural), ENGLISH.opposite]
    : grade <= 4 ? [() => ENGLISH.plural(W.pluralHard), ENGLISH.opposite, ENGLISH.past]
    : [ENGLISH.past, ENGLISH.synonym, () => ENGLISH.plural(W.pluralHard)];
  return pick(opts)();
}

// Builds one game: fresh maths every time, generated English mixed in, and bank questions the child hasn't seen lately.
function buildGame(kid, subject) {
  const n = C().questionsPerGame, used = new Set(), recent = new Set(kid.recent), out = [];
  const subjects = subject === 'mix' ? BANK.subjects.map(s => s.id) : [subject];
  let guard = 0;
  while (out.length < n && guard++ < 400) {
    const s = pick(subjects);
    let item = null;
    if (s === 'maths') item = MATHS[kid.grade]();
    else if (s === 'english' && Math.random() < .5) item = genEnglish(kid.grade);
    if (!item) {
      const pool = BANK.questions.filter(x => x.subject === s && (x.region === 'all' || x.region === S.region) && (x.grade === kid.grade || x.grade === kid.grade - 1));
      const fresh = pool.filter(x => !recent.has(x.question) && !used.has(x.question));
      const from = fresh.length ? fresh : pool.filter(x => !used.has(x.question));
      if (!from.length) continue;
      // prefer the child's own grade over the review grade
      const own = from.filter(x => x.grade === kid.grade);
      item = pick(own.length && Math.random() < .75 ? own : from);
    }
    if (!item || used.has(item.question)) continue;
    used.add(item.question);
    out.push({ ...item, right: item.answers[0], shown: shuffle(item.answers) });
  }
  kid.recent = [...kid.recent, ...used].slice(-C().recentQuestionMemory);
  return out;
}

// ---------- parent PIN ----------
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const randBytes = (n) => crypto.getRandomValues(new Uint8Array(n));
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  return b64(await crypto.subtle.digest('SHA-256', data));
}
async function setPin(pin) { const salt = b64(randBytes(16)); S.parent = { salt, hash: await hashPin(pin, salt) }; save(); }
async function checkPin(pin) { return !!S.parent && (await hashPin(pin, S.parent.salt)) === S.parent.hash; }
const pinOk = (p) => /^\d{4,8}$/.test(p);

// ---------- fingerprint login (passkeys) ----------
// The browser asks the device to check a fingerprint (or face) and only tells the game "yes" or "no".
// No fingerprint is ever seen or saved by the game.
let passkeyReady = false;
async function detectPasskeys() {
  try { passkeyReady = !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch { passkeyReady = false; }
}
async function enrollKid(kid) {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: randBytes(32),
    rp: { name: 'Credit Quiz' },
    user: { id: randBytes(16), name: `credit-quiz-${kid.name.toLowerCase()}`, displayName: `${kid.name} (Credit Quiz)` },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000, attestation: 'none' } });
  kid.cred = b64(cred.rawId); save();
}
async function verifyKid(kid) {
  const res = await navigator.credentials.get({ publicKey: {
    challenge: randBytes(32), allowCredentials: [{ type: 'public-key', id: unb64(kid.cred) }],
    userVerification: 'required', timeout: 60000 } });
  return !!res && b64(res.rawId) === kid.cred;
}

function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
  return d[b.length];
}
// Lenient on spelling (colour/color, practise/practice, a dropped 's') but not on different words.
const sameWord = (a, b) => a === b || (HOMO[a] && HOMO[a].includes(b)) || a + 's' === b || b + 's' === a
  || (a.length >= 5 && b.length >= 5 && lev(a, b) <= 1);

function readingTokens(r) {
  const gloss = {};
  r.glossary.forEach(g => g.words.forEach(w => gloss[normWord(w)] = g));
  const toks = [];
  r.paragraphs.forEach((para, p) => para.split(/\s+/).filter(Boolean).forEach(raw => {
    const name = /[{}]/.test(raw), text = raw.replace(/[{}]/g, ''), key = normWord(text);
    toks.push({ p, text, key, gl: gloss[key] || null, check: !!key && !name && !/\d/.test(key) });
  }));
  return toks;
}
// Matches what was heard to the story, in order. Skipped or misread words stay unmatched.
function alignReading(toks, heard) {
  const ok = toks.map(t => t.check ? false : null);
  let p = 0;
  for (const w of heard) {
    const reach = w.length >= 4 ? 25 : 7;
    for (let k = p; k < Math.min(toks.length, p + reach); k++) {
      if (toks[k].check && sameWord(toks[k].key, w)) { ok[k] = true; p = k + 1; break; }
      if (k - p >= 6 && w.length < 4) break;
    }
  }
  return { ok, upto: p };
}

// Picks how to listen: on this device if the browser can, otherwise the browser's speech service if the parent allowed it.
async function micPlan() {
  if (!SRClass) return { ok: false, why: 'nosupport' };
  const mode = S.mic || 'off';
  if (mode === 'off') return { ok: false, why: 'off' };
  if (typeof SRClass.available === 'function') {
    for (const lang of [speechLang(), 'en-GB', 'en-US']) {
      try {
        let st = await SRClass.available({ langs: [lang], processLocally: true });
        if ((st === 'downloadable' || st === 'downloading') && typeof SRClass.install === 'function')
          st = (await SRClass.install({ langs: [lang], processLocally: true })) ? 'available' : st;
        if (st === 'available') return { ok: true, local: true, lang };
      } catch {}
    }
  }
  if (mode === 'device') return { ok: false, why: 'nolocal' };
  return { ok: true, local: false, lang: speechLang() };
}
function newRecognizer(plan, continuous) {
  const r = new SRClass();
  r.lang = plan.lang; r.continuous = continuous; r.interimResults = continuous; r.maxAlternatives = continuous ? 1 : 5;
  if (plan.local) { try { r.processLocally = true; } catch {} }
  return r;
}
async function micPermission() {
  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); return true; }
  catch { return false; }
}

function countdown(n) {
  if (!game) return;
  view.innerHTML = `<section class="sheet"><p class="eyebrow" style="text-align:center">📚 ${esc(game.passage.title)}</p>
    <div class="count${n ? '' : ' go'}" aria-live="assertive">${n || 'GO!'}</div>
    <p class="muted" style="text-align:center">${n ? 'Get ready to read out loud…' : 'Start reading now!'}</p></section>`;
  if (n) setTimeout(() => countdown(n - 1), 1000);
  else setTimeout(readAloud, 700);
}

function readAloud() {
  if (!game) return;
  const g = game, toks = readingTokens(g.passage);
  READ_CTX = { toks };
  const listening = g.plan.ok;
  view.innerHTML = `<section class="sheet">
    <div class="qhead"><span class="eyebrow">📚 Reading test · ${esc(g.passage.title)}</span>
      ${listening ? `<span class="listening" id="lis"><i></i> Listening</span>` : `<button class="iconbtn" id="readToMe">🔊 Listen to the story</button>`}</div>
    ${passageHtml(toks, 'g' + g.kid.grade)}
    <p class="muted" style="margin:0">${listening ? 'Read every word out loud. Words turn green when the game hears them. ' : g.plan.why ? MIC_WHY[g.plan.why] + ' ' : ''}Tap a dotted word to see what it means.</p>
    <div id="micErr" aria-live="polite"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="doneRead">I've finished reading</button></div></section>`;
  const tokEls = view.querySelectorAll('[data-w]');
  if (!listening) {
    document.getElementById('readToMe').onclick = () => say(g.passage.paragraphs.join(' ').replace(/[{}]/g, ''), 0.9);
    document.getElementById('doneRead').onclick = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); showQuestion(); };
    return;
  }
  const st = { active: true, finals: [], heard: [], rec: null, fails: 0, done: false };
  g.listen = st;
  const update = (heard) => {
    st.heard = heard;
    const { ok } = alignReading(toks, heard);
    tokEls.forEach((el, i) => el.classList.toggle('heard', ok[i] === true));
    const lastCheck = toks.map(t => t.check).lastIndexOf(true);
    if (ok[lastCheck] && !st.done) { st.done = true; setTimeout(stop, 1500); }
  };
  const start = () => {
    const rec = newRecognizer(g.plan, true);
    st.rec = rec;
    rec.onresult = (e) => {
      const interim = [];
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const words = e.results[i][0].transcript.split(/\s+/).map(normWord).filter(Boolean);
        if (e.results[i].isFinal) st.finals.push(...words); else interim.push(...words);
      }
      st.fails = 0;
      update([...st.finals, ...interim]);
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') fatal('denied');
      else if (e.error === 'network' || e.error === 'language-not-supported') fatal('network');

      if (st.active && game === g) {
        if (++st.fails < 8) { try { rec.start(); } catch { setTimeout(start, 200); } }

    st.active = false;
    const lis = document.getElementById('lis'); if (lis) lis.remove();
    const box = document.getElementById('micErr');
    if (box) box.innerHTML = `<div class="err" style="margin-top:8px">${MIC_WHY[why]} Keep reading, then tap "I've finished reading".</div>`;
    st.broken = why !== 'quiet';
  };
  const stop = () => {
    if (!st.active) { if (!st.shown) finishReading(toks); return; }
    st.active = false;
    document.getElementById('doneRead').disabled = true;
    const lis = document.getElementById('lis'); if (lis) lis.innerHTML = 'Checking…';
    const t = setTimeout(() => finishReading(toks), 1500);
    st.onStopped = () => { clearTimeout(t); finishReading(toks); };
    try { st.rec.stop(); } catch { clearTimeout(t); finishReading(toks); }
  };

  start();
}

function finishReading(toks) {
  const g = game, st = g && g.listen;
  if (!st || st.shown) return;
  st.shown = true;
  if (st.broken && !st.heard.length) return showQuestion();
  const { ok, upto } = alignReading(toks, st.heard);
  const checked = toks.filter((t, i) => t.check && i < upto).length;
  const right = ok.filter((v, i) => v === true && i < upto).length;
  const notReached = toks.filter((t, i) => t.check && i >= upto).length;
  g.read = [right, checked];
  const seen = new Set(), practise = [];
  toks.forEach((t, i) => { if (ok[i] === false && i < upto && !seen.has(t.key)) { seen.add(t.key); practise.push(t); } });
  READ_CTX = { toks };
  view.innerHTML = `<section class="sheet">
    <div class="qhead"><span class="eyebrow">📚 Reading test · ${esc(g.passage.title)}</span></div>
    <h2 style="font-size:1.8rem;margin-top:10px">${!checked ? 'The game couldn\'t hear you.' : practise.length === 0 ? 'Wow, every word was clear! 🎉' : practise.length <= 3 ? 'Great reading! 🌟' : 'Good reading! Let\'s practise a few words.'}</h2>
    ${checked ? `<div class="scorebar"><div class="stat"><b class="num" style="color:var(--good)">${right} / ${checked}</b><span>words read clearly</span></div></div>` : '<p class="muted">Check the microphone is on and read a bit louder next time.</p>'}
    ${notReached > 3 && checked ? '<p class="muted" style="margin:0">You stopped before the end of the story. That\'s OK!</p>' : ''}
    ${practise.length ? `<h3 style="font-size:1.35rem;margin-top:14px">Words to practise</h3>
      <p class="muted" style="margin:4px 0 0">Tap 🔊 to hear how the word sounds, then 🎤 to say it yourself.</p>
      <div class="practice">${practise.slice(0, 12).map((t, j) => `<div class="pw"><b>${esc(cleanWord(t.text))}</b>
        <button class="iconbtn" data-hear="${j}">🔊 Hear it</button>
        ${!st.broken ? `<button class="iconbtn" data-try="${j}">🎤 Say it</button>` : ''}
        <span data-res="${j}" aria-live="polite"></span></div>`).join('')}</div>` : ''}
    <details class="peek"><summary>See the story with the words marked</summary>${passageHtml(toks)}</details>
    <p class="muted" style="font-size:.85rem">The listening tool can mishear, especially names, accents and quiet voices. Use this as practice, not a mark.</p>
    <div class="row" style="margin-top:10px"><button class="btn" id="toQuiz">Next: ${g.qs.length} questions about the story</button></div></section>`;
  view.querySelectorAll('.peek [data-w]').forEach((el) => { const i = +el.dataset.w; if (ok[i] === true) el.classList.add('heard'); else if (ok[i] === false && i < upto) el.classList.add('miss'); });
  view.querySelectorAll('[data-hear]').forEach(b => b.onclick = () => say(cleanWord(practise[+b.dataset.hear].text), 0.7));
  view.querySelectorAll('[data-try]').forEach(b => b.onclick = () => tryWord(practise[+b.dataset.try], b, view.querySelector(`[data-res="${b.dataset.try}"]`)));
  document.getElementById('toQuiz').onclick = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); showQuestion(); };
}

// Listens for one word and says whether it was heard.
function tryWord(t, btn, out) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const rec = newRecognizer(game.plan, false);
  let heard = false;
  btn.disabled = true; out.innerHTML = '<span class="listening"><i></i> Say it now</span>';
  rec.onresult = (e) => {
    const alts = Array.from(e.results[0]).flatMap(a => a.transcript.split(/\s+/).map(normWord));
    heard = alts.some(w => sameWord(t.key, w));
  };
  rec.onend = () => {
    btn.disabled = false;
    out.innerHTML = heard ? '<span class="ok-chip">✓ Great!</span>' : '<span class="muted">Not quite. Tap 🔊 to listen, then try again.</span>';
  };
  rec.onerror = () => {};
  try { rec.start(); } catch { btn.disabled = false; out.textContent = ''; }
}

function bindOnlineBuy(pack) {
  const say = (msg, bad = false) => { buy.msg = msg; buy.bad = bad; parentDash(); };
  view.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { buy.mode = b.dataset.mode; buy.msg = ''; parentDash(); });
  const af = document.getElementById('acctForm');
  if (af) af.onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim(), pwEl = document.getElementById('pw'), password = pwEl ? pwEl.value : '', m = buy.mode || 'signin';
    buy.email = email;
    af.querySelector('button').disabled = true;
    let res;
    if (m === 'signup') {
      buy.fullName = document.getElementById('fullName').value.trim(); buy.phone = document.getElementById('phone').value.trim();
      if (buy.phone.replace(/\D/g, '').length < 8) { af.querySelector('button').disabled = false; return say('Please type a full phone number.', true); }
      res = await NET.sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE, data: { full_name: buy.fullName, phone: buy.phone } } });
    }
    else if (m === 'forgot') res = await NET.sb.auth.resetPasswordForEmail(email, { redirectTo: SITE });
    else res = await NET.sb.auth.signInWithPassword({ email, password });
    const err = res.error;
    if (err) return say(/rate limit/i.test(err.message) ? 'Too many emails were sent in the last hour. Please try again later.'
      : /invalid login/i.test(err.message) ? 'That email and password don\'t match. Check them, or tap "Forgot password?".'
      : /already registered/i.test(err.message) ? 'This email is already registered. Sign in instead.' : esc(err.message), true);
    if (m === 'forgot') return say(`Check ${esc(email)} for a link to choose a new password (look in spam too).`);
    if (m === 'signup' && !(res.data && res.data.session)) return say(`Almost done: open the email we sent to ${esc(email)} to confirm, then sign in here.`);
    NET.user = res.data.user; buy.msg = ''; buy.mode = 'signin';
    await netRefresh(); parentDash();
  };
  const np = document.getElementById('newPw');
  if (np) np.onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await NET.sb.auth.updateUser({ password: document.getElementById('pw1').value });
    if (error) return say(esc(error.message), true);
    NET.recovery = false; say('New password saved.');
  };
  view.querySelectorAll('[data-pack]').forEach(b => b.onclick = () => { buy.pack = b.dataset.pack; buy.msg = ''; parentDash(); });
  const bk = document.getElementById('buyKid'); if (bk && NET.on) bk.onchange = () => { buy.kid = bk.value; buy.msg = ''; parentDash(); };
  const ib = document.getElementById('infoBtn');
  if (ib) ib.onclick = () => { const box = document.getElementById('bankInfo'); box.hidden = !box.hidden; buy.showInfo = !box.hidden; ib.setAttribute('aria-expanded', !box.hidden); };
  const c = document.getElementById('cancelBuy'); if (c) c.onclick = () => { buy.pack = null; buy.msg = ''; parentDash(); };
  const rf = document.getElementById('receiptForm');
  if (rf) rf.onsubmit = async (e) => {
    e.preventDefault();
    const file = document.getElementById('receipt').files[0], btn = document.getElementById('sendReceipt'), kid = S.kids.find(k => k.id === buy.kid);
    if (!file) return say('Choose the receipt file first.', true);
    if (file.size > 5 * 1024 * 1024) return say('That file is too big. Please send a file under 5 MB, for example a screenshot.', true);
    btn.disabled = true; btn.textContent = 'Sending…';
    const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg').slice(0, 5);
    const path = `${NET.user.id}/${Date.now()}.${ext}`;
    const up = await NET.sb.storage.from('receipts').upload(path, file, { contentType: file.type || undefined });
    if (up.error) return say(/mime|type/i.test(up.error.message) ? 'Please send a photo, screenshot or PDF of the receipt.' : 'The receipt could not be sent. Please try again.', true);
    const { error } = await NET.sb.rpc('request_topup', { p_pack: pack.id, p_currency: REG().currency, p_receipt_path: path, p_kid_id: kid.id, p_kid_name: kid.name });
    if (error) return say(/too_many/.test(error.message) ? 'You already have 5 top-ups waiting to be checked. Please wait for the host.' : 'The receipt could not be sent. Please try again.', true);
    buy.pack = null; await netRefresh();
    say(`Thank you! Your receipt was sent. The host will check it and add ${pack.credits} play credits for ${esc(kid.name)}.`);
  };
  const pay = document.getElementById('payNow');
  if (pay) pay.onclick = async () => {
    pay.disabled = true; pay.textContent = 'Opening the payment page…';
    const { data, error } = await NET.sb.functions.invoke('create-checkout', { body: { packId: pack.id, currency: REG().currency } });
    if (error || !data || !data.url) return say('The payment page could not be opened. Please try again.', true);
    location.href = data.url;
  };
}

async function hostPage() {
  if (!NET.host) return setTab('parent');
  view.innerHTML = `<section class="sheet"><p class="muted">Loading host settings…</p></section>`;
  const [set, sales, fams, tops] = await Promise.all([
    NET.sb.from('host_settings').select('*').eq('id', 1).single(),
    NET.sb.from('purchases').select('created_at,email,credits,amount,currency,kind').order('created_at', { ascending: false }).limit(100),
    NET.sb.from('families').select('user_id', { count: 'exact', head: true }),
    NET.sb.from('topups').select('*').order('created_at', { ascending: false }).limit(60)]);
  if (set.error) { view.innerHTML = `<section class="sheet"><div class="err">Couldn't load the host settings. Reload and try again.</div></section>`; return; }
  if (!hostDraft) hostDraft = JSON.parse(JSON.stringify(set.data));
  const topups = tops.data || [];
  const links = {};
  if (topups.length) {
    const { data } = await NET.sb.storage.from('receipts').createSignedUrls(topups.map(t => t.receipt_path), 3600);
    (data || []).forEach(d => { if (d.signedUrl) links[d.path] = d.signedUrl; });
  }
  topups.forEach(t => t.link = links[t.receipt_path]);
  renderHost(sales.data || [], fams.count || 0, topups);
}
function renderHost(sales, families, topups = []) {
  const again = () => renderHost(sales, families, topups);
  const d = hostDraft, month = new Date().toISOString().slice(0, 7);
  const totals = {};
  sales.filter(p => p.kind !== 'gift' && p.created_at.startsWith(month)).forEach(p => totals[p.currency] = (totals[p.currency] || 0) + +p.amount);
  const fmt = (v, c) => new Intl.NumberFormat(undefined, { style: 'currency', currency: c || 'AUD' }).format(v);
  const B = d.bank = d.bank || {}; B.aud = B.aud || {}; B.nzd = B.nzd || {};
  const bf = (cur, key, label, ph = '') => `<label class="f" for="b_${cur}_${key}">${label}<input type="text" id="b_${cur}_${key}" data-bank="${cur}" data-key="${key}" value="${esc(B[cur][key] || '')}" placeholder="${ph}"></label>`;
  const pending = topups.filter(t => t.status === 'pending'), done = topups.filter(t => t.status !== 'pending').slice(0, 10);
  const reqRow = (t) => `<div class="req">
      <div class="kv"><b>For ${esc(t.kid_name || 'the family')}</b><span class="num">${t.created_at.slice(0, 10)}</span></div>
      <div class="kv"><span>Parent: <b>${esc(t.full_name || '')}</b></span></div>
      <div class="kv"><span style="overflow-wrap:anywhere">${esc(t.email)}</span>${t.phone ? `<span class="num">📞 ${esc(t.phone)}</span>` : ''}</div>
      <div class="kv"><span>🎟 ${t.credits} credits · <b class="num">${fmt(t.amount, t.currency)}</b></span><span>Reference <b class="num">${esc(t.reference)}</b></span></div>
      <div class="row">${t.link ? `<a class="btn ghost" href="${t.link}" target="_blank" rel="noopener">View receipt</a>` : '<span class="muted">Receipt not found</span>'}
        <button class="btn" data-approve="${t.id}">Approve: send ${t.credits} credits${t.kid_name ? ` to ${esc(t.kid_name)}` : ''}</button>
        <input type="text" id="note${t.id}" placeholder="Reason if not approved" style="flex:1;min-width:140px">
        <button class="btn ghost" data-reject="${t.id}">Not approved</button></div>
    </div>`;
  const num = (key, label, min, max) => `<label class="f" for="h_${key}">${label}<input type="number" id="h_${key}" data-h="${key}" min="${min}" max="${max}" value="${d[key]}"></label>`;
  view.innerHTML = `
  <div class="grid">
    <section class="panel">
      <h2>Game rules for every family</h2>
      <div class="cfg">
        ${num('questions_per_game', 'Questions per game', 3, 20)}
        ${num('play_credits_per_game', 'Play credits per game', 0, 20)}
        ${num('reward_per_correct', '★ per right answer', 0, 20)}
        ${num('perfect_bonus', '★ bonus for all right', 0, 50)}
        ${num('starter_credits', 'Free credits for a new family', 0, 100)}
      </div>
      <div class="eyebrow">Credit packs parents can buy</div>
      ${d.packs.map((p, i) => `<div class="packrow">
        <label class="f" for="pc${i}">Credits<input type="number" id="pc${i}" data-pk="${i}" data-field="credits" min="1" value="${p.credits}"></label>
        <label class="f" for="pa${i}">Price AUD<input type="number" id="pa${i}" data-pk="${i}" data-field="aud" min="0.5" step="0.01" value="${p.aud}"></label>
        <label class="f" for="pn${i}">Price NZD<input type="number" id="pn${i}" data-pk="${i}" data-field="nzd" min="0.5" step="0.01" value="${p.nzd}"></label>
        <button class="btn ghost" data-delpk="${i}" ${d.packs.length < 2 ? 'disabled' : ''} aria-label="Remove pack ${i + 1}">✕</button></div>`).join('')}
      <div class="row"><button class="btn ghost" id="addPack" ${d.packs.length >= 6 ? 'disabled' : ''}>Add a pack</button></div>
      <div class="row"><button class="btn" id="saveHost">Save for every family</button><button class="btn ghost" id="undoHost">Undo changes</button></div>
      <div id="hostMsg" aria-live="polite">${hostMsg}</div>
      <p class="muted" style="margin:0;font-size:.85rem">Prices include any GST. Stripe keeps a small fee from each payment and sends the rest to your bank account.</p>
    </section>
    <section class="panel">
      <h2>Top-up requests ${pending.length ? `<span class="chip play">${pending.length} to check</span>` : ''}</h2>
      <p class="muted" style="margin:0;font-size:.85rem">Check your bank for a payment with the same amount and the child's name as reference, then approve.</p>
      <div class="reqs">${pending.map(reqRow).join('') || '<p class="muted" style="margin:0">Nothing to check right now.</p>'}</div>
      <div id="reqMsg" aria-live="polite"></div>
      ${done.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Parent</th><th class="num">Paid</th><th>Result</th></tr></thead><tbody>
        ${done.map(t => `<tr><td class="num">${t.created_at.slice(0, 10)}</td><td style="overflow-wrap:anywhere">${esc(t.email)}</td><td class="num">${fmt(t.amount, t.currency)}</td><td>${t.status === 'approved' ? `✓ ${t.credits} added` : `✕ ${esc(t.note || 'Not approved')}`}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </section>
    <section class="panel">
      <h2>Info: bank account for top-ups</h2>
      <p class="muted" style="margin:0;font-size:.85rem">Parents see these details when they tap ⓘ in Top up. Leave a currency's account number empty to turn bank transfer off for it.</p>
      <div class="eyebrow">Australia (AUD)</div>
      <div class="cfg">${bf('aud', 'accountName', 'Account name')}${bf('aud', 'bankName', 'Bank', 'e.g. Commonwealth Bank')}${bf('aud', 'bsb', 'BSB', '000-000')}${bf('aud', 'accountNumber', 'Account number')}</div>
      <div class="eyebrow">New Zealand (NZD)</div>
      <div class="cfg">${bf('nzd', 'accountName', 'Account name')}${bf('nzd', 'bankName', 'Bank', 'e.g. ANZ')}${bf('nzd', 'accountNumber', 'Account number', '00-0000-0000000-00')}</div>
      <label class="f" for="b_instr">Message for parents (optional)<input type="text" id="b_instr" maxlength="200" value="${esc(B.instructions || '')}" placeholder="Credits are usually added within 24 hours."></label>
      <div class="row"><button class="btn" id="saveInfo">Save bank details</button></div>
      <div id="infoMsg" aria-live="polite">${hostInfoMsg}</div>
    </section>
    <section class="panel">
      <h2>Sales</h2>
      <div class="stats">
        <div class="stat"><b>${families}</b><span>Families</span></div>
        ${Object.keys(totals).length ? Object.entries(totals).map(([c, v]) => `<div class="stat"><b>${fmt(v, c)}</b><span>This month (${c})</span></div>`).join('') : `<div class="stat"><b>–</b><span>Sales this month</span></div>`}
      </div>
      <div class="tablewrap"><table><thead><tr><th>Date</th><th>Parent</th><th class="num">Credits</th><th class="num">Paid</th></tr></thead><tbody>
        ${sales.slice(0, 20).map(p => `<tr><td class="num">${p.created_at.slice(0, 10)}</td><td style="overflow-wrap:anywhere">${esc(p.email || '')}</td><td class="num">${p.credits}</td><td class="num">${p.kind === 'gift' ? 'Gift' : fmt(p.amount, p.currency)}</td></tr>`).join('') || `<tr><td colspan="4" class="muted">No sales yet.</td></tr>`}
      </tbody></table></div>
      <div class="eyebrow">Give free credits</div>
      <p class="muted" style="margin:0;font-size:.85rem">For a refund, a prize or a test. The parent must have signed in once. Use a minus number to take credits away.</p>
      <form class="row" id="gift"><input id="giftEmail" type="email" required placeholder="parent@example.com" style="flex:2;min-width:180px"><input id="giftN" type="number" required value="10" style="flex:1;min-width:80px"><button class="btn ghost">Give</button></form>
      <div id="giftMsg" aria-live="polite"></div>
    </section>
  </div>`;
  const keep = () => {
    view.querySelectorAll('[data-bank]').forEach(i => B[i.dataset.bank][i.dataset.key] = i.value.trim());
    B.instructions = document.getElementById('b_instr').value.trim();
    view.querySelectorAll('[data-h]').forEach(i => d[i.dataset.h] = Math.round(+i.value));
    view.querySelectorAll('[data-pk]').forEach(i => d.packs[+i.dataset.pk][i.dataset.field] = i.dataset.field === 'credits' ? Math.round(+i.value) : Math.round(+i.value * 100) / 100);
  };
  view.querySelectorAll('[data-delpk]').forEach(b => b.onclick = () => { keep(); d.packs.splice(+b.dataset.delpk, 1); hostMsg = ''; again(); });
  document.getElementById('addPack').onclick = () => { keep(); d.packs.push({ id: 'pack_' + b64(randBytes(4)).replace(/[^a-z0-9]/gi, ''), credits: 20, aud: 2.99, nzd: 3.29 }); hostMsg = ''; again(); };
  document.getElementById('undoHost').onclick = () => { hostDraft = null; hostMsg = ''; hostPage(); };
  document.getElementById('saveHost').onclick = async () => {
    keep();
    const bad = [['questions_per_game', 3, 20], ['play_credits_per_game', 0, 20], ['reward_per_correct', 0, 20], ['perfect_bonus', 0, 50], ['starter_credits', 0, 100]]
      .find(([k, lo, hi]) => !(d[k] >= lo && d[k] <= hi));
    const badPack = d.packs.find(p => !(p.credits >= 1) || !(p.aud >= 0.5) || !(p.nzd >= 0.5));
    if (bad || badPack) { hostMsg = `<div class="err">${bad ? 'A game rule is outside its allowed range.' : 'Each pack needs at least 1 credit and a price of at least 0.50 (Stripe\'s smallest payment).'}</div>`; return again(); }
    hostMsg = await saveHostSettings('Saved. Every family sees the new rules and prices now.');
    again();
  };
  document.getElementById('saveInfo').onclick = async () => {
    keep();
    hostInfoMsg = await saveHostSettings('Saved. Parents see these bank details when they top up.');
    again(); hostInfoMsg = '';
  };
  view.querySelectorAll('[data-approve],[data-reject]').forEach(b => b.onclick = async () => {
    keep();
    const id = +(b.dataset.approve || b.dataset.reject), ok = !!b.dataset.approve;
    b.disabled = true;
    const note = ok ? null : (document.getElementById('note' + id).value.trim() || null);
    const { error } = await NET.sb.rpc('host_decide_topup', { p_id: id, p_approve: ok, p_note: note });
    if (error) { document.getElementById('reqMsg').innerHTML = `<div class="err">${/already_decided/.test(error.message) ? 'That request was already handled.' : esc(error.message)}</div>`; b.disabled = false; return; }
    await netRefresh(); hostPage();
  });
  document.getElementById('gift').onsubmit = async (e) => {
    e.preventDefault(); keep();
    const email = document.getElementById('giftEmail').value.trim(), n = Math.round(+document.getElementById('giftN').value), m = document.getElementById('giftMsg');
    const { data, error } = await NET.sb.rpc('host_grant', { p_email: email, p_credits: n });
    if (error) m.innerHTML = `<div class="err">${/no_such_family/.test(error.message) ? 'No family with that email. They need to sign in once first.' : esc(error.message)}</div>`;
    else { m.innerHTML = `<div class="toast">Done. ${esc(email)} now has ${data} play credits.</div>`; if (NET.user && email.toLowerCase() === (NET.user.email || '').toLowerCase()) NET.balance = data; }
  };
}

boot();
</script>
</body>
</html>
